name: Update Dependencies

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages to update; empty updates all"
        required: false
        default: ""
      inputs:
        description: "Space-separated flake inputs to update; empty updates all"
        required: false
        default: ""

jobs:
  update:
    uses: ./.github/workflows/update-flake.yml
    with:
      packages: ${{ github.event.inputs.packages }}
      inputs: ${{ github.event.inputs.inputs }}
      auto-merge: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: read
